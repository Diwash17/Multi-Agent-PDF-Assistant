[project]
name = "multi-agent-pdf-assistant"
version = "0.1.0"
description = "A multi-agent PDF assistant using FastAPI, LangGraph, Gemini, and PostgreSQL/pgvector"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    # LangChain / LangGraph / Gemini
    "langchain>=0.2.0",
    "langgraph>=0.1.0",
    "langchain-google-genai>=1.0.0",
    "langchain-community>=0.2.0",
    "langchain-text-splitters>=0.2.0",
    # PDF processing
    "pymupdf>=1.24.0",
    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",
    "psycopg2-binary>=2.9.9",
    # Config / env
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    # HTTP client (frontend → backend)
    "httpx>=0.27.0",
    # Retry logic
    "tenacity>=8.3.0",
    # Frontend
    "streamlit>=1.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
